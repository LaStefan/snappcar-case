<section class="search-controls" aria-labelledby="search-controls-title">
  <header class="search-controls__header">
    <p class="search-controls__eyebrow">Snapp a car from your neighborhood</p>

    <h1 id="search-controls-title">Where do you need a car?</h1>

    <p>
      Rent your perfect car easily, affordably and well-insured right in your
      neighbourhood
    </p>
  </header>

  <div class="search-controls__field">
    <label for="city">City</label>

    <div class="search-controls__input">
      <span class="search-controls__input-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M4 21V8l6-3v16M10 21V3l10 4v14M2 21h20"></path>
          <path d="M7 10h.01M7 14h.01M14 9h2M14 13h2M14 17h2"></path>
        </svg>
      </span>

      <input
        id="city"
        type="search"
        [formControl]="cityControl"
        list="supported-cities"
        placeholder="Try Utrecht"
        autocomplete="off"
        spellcheck="false"
        aria-describedby="city-hint"
      />
    </div>

    <datalist id="supported-cities">
      <option *ngFor="let city of cities" [value]="city.name">
        {{ city.name }}, {{ city.country }}
      </option>
    </datalist>

    <small id="city-hint">
      Start typing and select one of the supported cities.
    </small>
  </div>

  <div class="search-controls__filters">
    <div class="search-controls__field">
      <label for="max-distance"> Maximum distance </label>

      <div class="search-controls__input">
        <span class="search-controls__input-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <circle cx="6" cy="18" r="2"></circle>
            <circle cx="18" cy="6" r="2"></circle>
            <path d="M8 18h3a3 3 0 0 0 3-3v-6a3 3 0 0 1 3-3"></path>
          </svg>
        </span>

        <select id="max-distance" [formControl]="maxDistanceControl">
          <!-- [ngValue] preserves the numeric distance type. Plain HTML value would normally produce a string such as "5000". -->
          <option
            *ngFor="let option of maxDistanceOptions"
            [ngValue]="option.value"
          >
            {{ option.label }}
          </option>
        </select>
      </div>
    </div>

    <div class="search-controls__field">
      <label for="sort"> Sort results by </label>

      <div class="search-controls__input">
        <span class="search-controls__input-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M4 7h10M4 12h7M4 17h4M18 5v14M15 16l3 3 3-3"></path>
          </svg>
        </span>

        <select id="sort" [formControl]="sortControl">
          <option *ngFor="let option of sortOptions" [value]="option.value">
            {{ option.label }}
          </option>
        </select>
      </div>
    </div>

    <div class="search-controls__field">
      <label for="sort-order"> Direction </label>

      <div class="search-controls__input">
        <span class="search-controls__input-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M8 4v16M5 7l3-3 3 3M16 20V4M13 17l3 3 3-3"></path>
          </svg>
        </span>

        <select id="sort-order" [formControl]="sortOrderControl">
          <option
            *ngFor="let option of sortOrderOptions"
            [ngValue]="option.value"
          >
            {{ option.label }}
          </option>
        </select>
      </div>
    </div>
  </div>
</section>
