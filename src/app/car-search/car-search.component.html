<main class="car-search">
  <app-search-controls
    [cityControl]="cityControl"
    [cities]="supportedCities"
    [maxDistanceControl]="maxDistanceControl"
    [sortControl]="sortControl"
    [sortOrderControl]="sortOrderControl"
  ></app-search-controls>

  <ng-container *ngIf="searchState$ | async as state">
    <app-search-results
      [state]="state"
      (loadMore)="loadMore()"
    ></app-search-results>
  </ng-container>
</main>
